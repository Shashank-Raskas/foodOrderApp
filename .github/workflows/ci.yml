# Runs on every push and pull request: lint, frontend + backend unit tests, and the chatbot's
# retrieval regression check. Everything here is offline: no API keys or secrets are needed.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The exact version the project is developed and tested with
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix backend

      - name: Lint
        run: npm run lint

      # The github-actions reporter turns each failing test into an annotation on the run, so the
      # failure is visible on the run's page (and through the API) without opening the raw log
      - name: Frontend tests
        run: npm test -- --ci --reporters=default --reporters=github-actions

      # The remaining checks still run when an earlier one fails, so one run reports every problem
      - name: Backend tests
        if: ${{ !cancelled() }}
        run: npm run test:backend -- --ci --reporters=default --reporters=github-actions

      # The embedding model and reranker (~60 MB) are downloaded once and cached between runs
      - uses: actions/cache@v6
        if: ${{ !cancelled() }}
        with:
          path: backend/rag/.models
          key: rag-models-${{ hashFiles('backend/rag/config.js') }}

      - name: Chatbot retrieval regression check
        if: ${{ !cancelled() }}
        run: npm run rag:eval:offline --prefix backend
