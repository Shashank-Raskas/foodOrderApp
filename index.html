<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://orderapp-backend-czwe.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://orderapp-backend-czwe.onrender.com" />
    <title>The Flavor Alchemist</title>
    <meta name="theme-color" content="#11100e" />
    <script>
      // Apply the saved colour theme before the first paint (dark unless the visitor chose light)
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff');
        }
      } catch (e) { /* storage unavailable */ }
    </script>
  </head>
  <body>
    <div id="modal"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
